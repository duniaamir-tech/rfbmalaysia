<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFB Malaysia | Telecom Infrastructure Technology Partner</title>
    <meta name="description" content="RFB Malaysia is a telecom network infrastructure partner for telcos, ISPs, network operators, data centers and hospitality groups. FNT Command OSS/DCIM software, AXING fiber and coaxial distribution, hotel IPTV and lightning protection solutions.">
    <link rel="icon" type="image/jpeg" href="assets/RFB%20Logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="assets/RFB%20Logo.jpg">
    <link rel="apple-touch-icon" href="assets/RFB%20Logo.jpg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Include Header Component -->
    <!--#include virtual="header.html" -->
    <!-- Or if using a JS loader / template framework, load header.html here -->
    <div id="header-container"></div>

    <!-- Include Hero Component -->
    <div id="hero-container"></div>

    <!-- Include About Us Component -->
    <div id="about-container"></div>

    <!-- Include Solutions Component -->
    <div id="services-container"></div>

    <!-- Include Trust Bar Component -->
    <div id="expertise-container"></div>

    <!-- Include Clients & Partners Component -->
    <div id="clients-container"></div>

    <!-- Include Contact Component -->
    <div id="contact-container"></div>

    <!-- Include Footer Component -->
    <div id="footer-container"></div>

    <!-- Simple script to fetch and inject components for local preview -->
    <script>
        async function loadComponent(id, file) {
            const response = await fetch(file);
            const html = await response.text();
            document.getElementById(id).innerHTML = html;
        }
        loadComponent('header-container', 'header.html');
        loadComponent('hero-container', 'hero.html');
        loadComponent('about-container', 'about.html');
        loadComponent('services-container', 'services.html');
        loadComponent('expertise-container', 'expertise.html');
        loadComponent('clients-container', 'clients.html');
        loadComponent('contact-container', 'contact.html');
        loadComponent('footer-container', 'footer.html');
    </script>
</body>
</html>
